# ci-checks for kc-control-plane (design §6.3): lint, format, tests, schema check.
# Required by the merge gate on pull requests to main (§6.5.1).
name: ci-checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci-checks:
    name: ci-checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: pytest
        run: uv run pytest
      - name: schema check
        run: |
          uv run kc-validate schemas
          for f in tests/fixtures/schemas/*.valid.json; do
            name=$(basename "$f" .valid.json)
            uv run kc-validate file "$f" --schema "$name"
          done
          uv run kc-validate repo tests/fixtures/repos/dda-customer
      - name: Dockerfile builds
        run: |
          docker build -f build/Dockerfile --target service -t evaluator:ci .
          docker build -f build/Dockerfile --target job -t evaluator-sweep:ci .
