[project]
name = "kc-control-plane"
version = "0.1.0"
description = "DDA control plane: control evaluator (C12, C14), contract writer, shared catalogue library and schema validator"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "croniter>=6.2.4",
    "flask>=3.1.3",
    "google-auth>=2.62.1",
    "gunicorn>=26.2.0",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
kc-validate = "kc_validate.cli:main"
evaluator-sweep = "evaluator.sweep:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdmc_common", "src/evaluator", "src/kc_validate"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "kc_validate/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
