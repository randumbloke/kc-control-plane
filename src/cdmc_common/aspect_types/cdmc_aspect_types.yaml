  cdmc-data-product-quality:
    metadataTemplate:
      name: cdmc-data-product-quality
      type: record
      recordFields:
      - name: aggregate_dq_score
        type: double
        index: 1
        annotations:
          displayName: Aggregate dq score
          description: Pooled rule pass rate, 0 to 100
      - name: aggregate_dq_status
        type: enum
        index: 2
        annotations:
          displayName: Aggregate dq status
          description: Product quality status (ref arch 9.5)
        constraints:
          required: true
        enumValues:
        - name: COMPLIANT
          index: 1
        - name: NON_COMPLIANT
          index: 2
        - name: NOT_EVALUATED
          index: 3
      - name: freshness_status
        type: enum
        index: 3
