          constraints:
            required: true
        - name: source_ref
          type: string
          index: 3
          annotations:
            displayName: Source ref
            description: Resource name of the evidence
          constraints:
            required: true
      - name: narrative
        type: record
        index: 3
        annotations:
          displayName: Narrative
          description: Advisory record; reserved, no component writes it (P5-2)
        recordFields:
        - name: summary
          type: string
          index: 1
          annotations:
            displayName: Summary
            description: ''
        - name: model
          type: string
          index: 2
          annotations:
            displayName: Model
            description: ''
        - name: prompt_version
          type: string
          index: 3
          annotations:
            displayName: Prompt version
            description: ''
        - name: authoritative
          type: bool
          index: 4
          annotations:
            displayName: Authoritative
            description: ''
      - name: schema_version
        type: int
        index: 4
        annotations:
          displayName: Schema version
          description: Version of the template the payload was written against
        constraints:
          required: true
  cdmc-lineage-evidence:
    metadataTemplate:
      name: cdmc-lineage-evidence
      type: record
      recordFields:
      - name: run_time_ultimate_source
        type: array
        index: 1
        annotations:
          displayName: Run time ultimate source
          description: Origins resolved from run-time lineage (FQNs)
        arrayItems:
          name: source_fqn
          type: string
      - name: design_time_ultimate_source
        type: array
        index: 2
        annotations:
          displayName: Design time ultimate source
          description: Origins declared in the domain's lineage manifest
        arrayItems:
          name: source_fqn
          type: string
      - name: upstream_data_products
        type: array
        index: 3
        annotations:
          displayName: Upstream data products
          description: Data products crossed on the way to the ultimate sources
        arrayItems:
          name: data_product
          type: string
      - name: evaluation
        type: record
        index: 4
        annotations:
          displayName: Evaluation
          description: The authoritative evaluation record (D-01)
        constraints:
          required: true
        recordFields:
        - name: evaluator_version
          type: string
          index: 1
          annotations:
            displayName: Evaluator version
            description: Module name and version, for example c12-rollup@1.3.0
          constraints:
            required: true
        - name: evaluated_at
          type: datetime
          index: 2
          annotations:
            displayName: Evaluated at
            description: When the writer computed the values
          constraints:
            required: true
        - name: source_ref
          type: string
          index: 3
          annotations:
            displayName: Source ref
            description: Resource name of the evidence
          constraints:
            required: true
      - name: narrative
        type: record
        index: 5
        annotations:
          displayName: Narrative
          description: Advisory record; reserved, no component writes it (P5-2)
        recordFields:
        - name: summary
          type: string
          index: 1
          annotations:
            displayName: Summary
            description: ''
        - name: model
          type: string
          index: 2
          annotations:
            displayName: Model
            description: ''
        - name: prompt_version
          type: string
          index: 3
          annotations:
            displayName: Prompt version
            description: ''
        - name: authoritative
          type: bool
          index: 4
          annotations:
            displayName: Authoritative
            description: ''
      - name: schema_version
        type: int
        index: 6
        annotations:
          displayName: Schema version
          description: Version of the template the payload was written against
        constraints:
          required: true
